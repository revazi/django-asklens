[mypy]
python_version = 3.12
strict = True
show_error_codes = True
show_column_numbers = True
pretty = False
incremental = False

# Core Django has no py.typed marker. This is the only untyped import used by
# these consumer fixtures; it does NOT establish Model/QuerySet precision.
[mypy-django.db.models]
ignore_missing_imports = True
