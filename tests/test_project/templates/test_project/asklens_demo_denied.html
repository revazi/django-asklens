<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fafafa;
      color: #18181b;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      padding: 1rem;
    }
    .panel {
      width: min(28rem, 100%);
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
      background: #ffffff;
      padding: 1.25rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1rem; color: #52525b; }
    button {
      min-height: 2.5rem;
      border: 0;
      border-radius: 0.5rem;
      background: #18181b;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      padding: 0.6rem 0.85rem;
    }
    button:hover { background: #27272a; }
    button:focus-visible { outline: 3px solid #a1a1aa; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Access unavailable</h1>
    <p>This page is not available for this account.</p>
    <form method="post" action="/admin/logout/">
      {% csrf_token %}
      <input type="hidden" name="next" value="/admin/login/?next=/">
      <button type="submit">Sign out and switch account</button>
    </form>
  </main>
</body>
</html>
