services:
  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_DB: asklens_demo
      POSTGRES_USER: asklens_demo
      POSTGRES_PASSWORD: asklens-demo-only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${ASKLENS_COMPOSE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
