name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        django-version: ["5.2", "6.x"]
        include:
          - django-version: "5.2"
            django-package: "Django>=5.2,<6.0"
            django-version-prefix: "5.2."
          - django-version: "6.x"
            django-package: "Django>=6.0,<7.0"
            django-version-prefix: "6."

    env:
      DJANGO_ASKLENS_LIVE_LLM: "0"
      DJANGO_ASKLENS_DEMO_LIVE_LLM: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install Django matrix version
        run: uv pip install --reinstall "${{ matrix.django-package }}"

      - name: Run Ruff lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Compile Python files
        run: uv run --no-sync python -m compileall -q django_asklens tests

      - name: Run Django system check
        run: uv run --no-sync python -m django check --settings=tests.test_project.settings

      - name: Check AskLens migrations are current
        run: uv run --no-sync python -m django makemigrations asklens --check --dry-run --settings=tests.test_project.settings

      - name: Run tests
        run: uv run --no-sync pytest --strict-config --strict-markers

      - name: Build package
        run: uv run --no-sync python -m build

      - name: Check package metadata
        run: uv run --no-sync twine check dist/*

      - name: Inspect package artifacts
        run: |
          uv run --no-sync python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("django_asklens-*.whl"))
          sdists = sorted(dist.glob("django_asklens-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got {wheels=} {sdists=}")

          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = set(wheel.namelist())
              [metadata_name] = [
                  name for name in wheel_names if name.endswith(".dist-info/METADATA")
              ]
              metadata = Parser().parsestr(wheel.read(metadata_name).decode("utf-8"))
          with tarfile.open(sdists[0], "r:gz") as sdist:
              sdist_names = set(sdist.getnames())

          forbidden_requirements = [
              requirement
              for requirement in metadata.get_all("Requires-Dist", [])
              if requirement.lower().replace("_", "-").startswith(
                  ("playwright", "psycopg")
              )
          ]
          if forbidden_requirements:
              raise SystemExit(
                  "Dev-only dependencies leaked into wheel Requires-Dist: "
                  f"{forbidden_requirements}"
              )

          forbidden_fragments = (".agents/", "asklens-llm-io")
          for artifact_name, names in ((wheels[0].name, wheel_names), (sdists[0].name, sdist_names)):
              forbidden = [
                  name
                  for name in names
                  if any(fragment in name for fragment in forbidden_fragments)
              ]
              if forbidden:
                  raise SystemExit(f"Forbidden local-only files in {artifact_name}: {forbidden}")

          required_wheel_files = {
              "django_asklens/__init__.py",
              "django_asklens/api/views.py",
              "django_asklens/contracts/schemas/capabilities.schema.json",
              "django_asklens/contracts/schemas/catalog.schema.json",
              "django_asklens/contracts/schemas/error.schema.json",
              "django_asklens/contracts/schemas/query-plan.schema.json",
              "django_asklens/contracts/schemas/result.schema.json",
              "django_asklens/management/__init__.py",
              "django_asklens/management/_audit_lifecycle.py",
              "django_asklens/management/commands/__init__.py",
              "django_asklens/management/commands/redact_asklens_audit.py",
              "django_asklens/results/presentation.py",
              "django_asklens/templates/admin/django_asklens/asklensquery/change_list.html",
              "django_asklens/templates/django_asklens/frontend/query.html",
          }
          missing_wheel_files = sorted(required_wheel_files - wheel_names)
          if missing_wheel_files:
              raise SystemExit(f"Missing expected wheel files: {missing_wheel_files}")

          required_sdist_suffixes = {
              "/README.md",
              "/LICENSE",
              "/compose.yaml",
              "/conformance/README.md",
              "/conformance/positive/list-scoped.json",
              "/docs/index.md",
              "/docs/conformance.md",
              "/docs/installation.md",
              "/docs/internal-contracts.md",
              "/docs/migrating-0.1-to-0.2.md",
              "/docs/pilot-intake-worksheet.md",
              "/docs/private-candidate-evaluation.md",
              "/docs/providers.md",
              "/docs/security-checklist.md",
              "/scripts/alpha-candidate-package-smoke.sh",
              "/scripts/reference-demo-smoke.sh",
              "/tests/e2e/reference_demo.py",
          }
          missing_sdist_files = sorted(
              suffix
              for suffix in required_sdist_suffixes
              if not any(name.endswith(suffix) for name in sdist_names)
          )
          if missing_sdist_files:
              raise SystemExit(f"Missing expected sdist files: {missing_sdist_files}")
          PY

      - name: Smoke test core wheel install without DRF
        run: |
          bash .github/scripts/wheel-smoke.sh \
            core \
            "${{ matrix.django-package }}" \
            "${{ matrix.django-version-prefix }}"

      - name: Smoke test MCP extra wheel install
        run: |
          bash .github/scripts/wheel-smoke.sh \
            mcp \
            "${{ matrix.django-package }}" \
            "${{ matrix.django-version-prefix }}"

      - name: Smoke test API extra wheel install
        run: |
          bash .github/scripts/wheel-smoke.sh \
            api \
            "${{ matrix.django-package }}" \
            "${{ matrix.django-version-prefix }}"

  postgresql:
    name: PostgreSQL ${{ matrix.postgresql-version }} / Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql-version: "15"
            python-version: "3.12"
            django-version: "5.2"
            django-package: "Django>=5.2,<6.0"
          - postgresql-version: "15"
            python-version: "3.13"
            django-version: "6.x"
            django-package: "Django>=6.0,<7.0"
          - postgresql-version: "18"
            python-version: "3.13"
            django-version: "6.x"
            django-package: "Django>=6.0,<7.0"

    services:
      postgres:
        image: postgres:${{ matrix.postgresql-version }}
        env:
          POSTGRES_DB: asklens
          POSTGRES_USER: asklens
          POSTGRES_PASSWORD: asklens-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asklens -d asklens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ASKLENS_LIVE_LLM: "0"
      DJANGO_ASKLENS_DEMO_LIVE_LLM: "0"
      DJANGO_SETTINGS_MODULE: tests.test_project.postgresql_settings
      DJANGO_ASKLENS_POSTGRES_DB: asklens
      DJANGO_ASKLENS_POSTGRES_USER: asklens
      DJANGO_ASKLENS_POSTGRES_PASSWORD: asklens-test-only
      DJANGO_ASKLENS_POSTGRES_HOST: 127.0.0.1
      DJANGO_ASKLENS_POSTGRES_PORT: "5432"
      DJANGO_ASKLENS_POSTGRES_EXPECTED_MAJOR: ${{ matrix.postgresql-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install Django matrix version
        run: uv pip install --reinstall "${{ matrix.django-package }}"

      - name: Guard backend/version and replay all conformance fixtures
        run: >-
          uv run --no-sync pytest --strict-config --strict-markers
          -m postgresql tests/conformance/test_replay.py

      - name: Run complete database-sensitive suite
        run: >-
          uv run --no-sync pytest --strict-config --strict-markers
          -m postgresql

      - name: Run PostgreSQL Django system check
        run: >-
          uv run --no-sync python -m django check
          --settings=tests.test_project.postgresql_settings

      - name: Check AskLens migrations under PostgreSQL settings
        run: >-
          uv run --no-sync python -m django makemigrations asklens
          --check --dry-run --settings=tests.test_project.postgresql_settings

  reference-demo:
    name: PostgreSQL 18 / Playwright reference demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development evidence dependencies
        run: uv sync --locked --group dev

      - name: Install Chromium and system dependencies
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run disposable Compose/Playwright reference smoke
        run: bash scripts/reference-demo-smoke.sh

  candidate-package:
    name: Source wheel and published-alpha replacement evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package evidence dependencies
        run: uv sync --locked --group dev

      - name: Run isolated source-wheel and upgrade evidence
        run: bash scripts/alpha-candidate-package-smoke.sh

  dependency-audit:
    name: Locked dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.12.1"
          cache-dependency-glob: uv.lock

      - name: Run locked dependency vulnerability audit
        run: uv audit --locked --preview-features audit-command
